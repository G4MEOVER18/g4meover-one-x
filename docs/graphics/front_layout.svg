<svg viewBox="0 0 560 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DE1C6"/><stop offset="1" stop-color="#48B6F0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="560" height="720" fill="#0f1722"/>
  <text x="32" y="40" fill="url(#g)" font-size="22" font-weight="800">Front-Layout · ONE-X</text>
  <text x="32" y="62" fill="#8aa0b8" font-size="13">230 × 110 × 64 mm · maßstäbliche Anordnung</text>

  <!-- device body -->
  <rect x="70" y="90" width="420" height="560" rx="34" fill="#16212e" stroke="url(#g)" stroke-width="2.5"/>

  <!-- antenna rail (top) -->
  <rect x="110" y="104" width="340" height="34" rx="8" fill="#0f1722" stroke="#213140"/>
  <g fill="url(#g)">
    <circle cx="160" cy="121" r="7"/><circle cx="235" cy="121" r="7"/>
    <circle cx="325" cy="121" r="7"/><circle cx="400" cy="121" r="7"/>
  </g>
  <text x="280" y="126" fill="#8aa0b8" font-size="10" text-anchor="middle">4× SMA — Antennen-Rail</text>

  <!-- display -->
  <rect x="110" y="158" width="340" height="300" rx="10" fill="#0b1017" stroke="#48B6F0" stroke-width="1.5"/>
  <text x="280" y="300" fill="#4b9dea" font-size="16" text-anchor="middle" font-weight="700">5,0″ IPS Multitouch</text>
  <text x="280" y="322" fill="#8aa0b8" font-size="12" text-anchor="middle">1280 × 720 · Landscape</text>

  <!-- softkeys -->
  <g fill="#213140" stroke="#4b9dea" stroke-width="1">
    <rect x="120" y="474" width="52" height="26" rx="6"/>
    <rect x="184" y="474" width="52" height="26" rx="6"/>
    <rect x="248" y="474" width="52" height="26" rx="6"/>
    <rect x="312" y="474" width="52" height="26" rx="6"/>
    <rect x="376" y="474" width="52" height="26" rx="6"/>
  </g>
  <text x="280" y="516" fill="#8aa0b8" font-size="11" text-anchor="middle">5 Softkeys</text>

  <!-- touch ring (left) -->
  <circle cx="165" cy="580" r="42" fill="none" stroke="url(#g)" stroke-width="6"/>
  <circle cx="165" cy="580" r="8" fill="#2DE1C6"/>
  <text x="165" y="640" fill="#8aa0b8" font-size="11" text-anchor="middle">40 mm Touch-Ring</text>

  <!-- d-pad (right) -->
  <g fill="#213140" stroke="#48B6F0" stroke-width="1.5">
    <rect x="378" y="558" width="24" height="24" rx="4"/>
    <rect x="352" y="584" width="24" height="24" rx="4"/>
    <rect x="404" y="584" width="24" height="24" rx="4"/>
    <rect x="378" y="610" width="24" height="24" rx="4"/>
  </g>
  <rect x="378" y="584" width="24" height="24" rx="4" fill="#16212e" stroke="#48B6F0"/>
  <text x="390" y="654" fill="#8aa0b8" font-size="11" text-anchor="middle">D-Pad 34×34</text>

  <!-- grip zones note -->
  <text x="42" y="360" fill="#8aa0b8" font-size="10" transform="rotate(-90 42 360)">Griffzone (SMA-frei)</text>
  <text x="524" y="360" fill="#8aa0b8" font-size="10" transform="rotate(90 524 360)">Griffzone (SMA-frei)</text>
</svg>
