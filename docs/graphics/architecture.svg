<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DE1C6"/><stop offset="1" stop-color="#48B6F0"/>
    </linearGradient>
    <style>
      .bg{fill:#0f1722}
      .panel{fill:#16212e;stroke:#213140;stroke-width:1.5;rx:12}
      .t{fill:#e7eef9}
      .m{fill:#8aa0b8}
      .h{fill:url(#g);font-weight:800}
      .lbl{fill:#8aa0b8;font-size:11px}
      .wire{stroke:#4b9dea;stroke-width:2;fill:none}
      .wire2{stroke:#2DE1C6;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="620"/>
  <text x="32" y="42" class="h" font-size="26">G4MEOVER ONE-X</text>
  <text x="32" y="66" class="m" font-size="14">Systemarchitektur · 4 getrennte Rechen-/Funkdomänen · Rev EVT6</text>

  <!-- Display -->
  <rect x="300" y="92" width="360" height="52" rx="12" class="panel"/>
  <text x="480" y="118" text-anchor="middle" class="t" font-size="15" font-weight="700">5,0″ IPS Multitouch · 1280×720</text>
  <text x="480" y="136" text-anchor="middle" class="lbl">4-Lane MIPI DSI (direkt vom RK3576)</text>

  <!-- RK3576 core -->
  <rect x="300" y="200" width="360" height="150" rx="12" class="panel"/>
  <text x="480" y="228" text-anchor="middle" class="h" font-size="18">RK3576 · Linux</text>
  <text x="480" y="252" text-anchor="middle" class="t" font-size="12">16 GB LPDDR5 · 256 GB UFS · 32 MB SPI-NOR</text>
  <text x="480" y="272" text-anchor="middle" class="m" font-size="11">UI · Netzwerk · USB · Storage · High-Level-RF-SW</text>
  <text x="480" y="300" text-anchor="middle" class="m" font-size="11">2× GbE · Wi-Fi 6E · USB-C PD/USB3/DP · USB-A · HDMI · M.2</text>
  <text x="480" y="322" text-anchor="middle" class="lbl">Mainboard 210×92 mm · 12-Layer HDI</text>

  <!-- RP2350 -->
  <rect x="40" y="200" width="220" height="150" rx="12" class="panel"/>
  <text x="150" y="228" text-anchor="middle" class="h" font-size="16">RP2350B</text>
  <text x="150" y="248" text-anchor="middle" class="t" font-size="12">System-Controller (Always-On)</text>
  <text x="150" y="272" text-anchor="middle" class="m" font-size="11">Power · Wake · D-Pad · Softkeys</text>
  <text x="150" y="290" text-anchor="middle" class="m" font-size="11">Touch-Ring · Haptik · Sensoren</text>
  <text x="150" y="308" text-anchor="middle" class="m" font-size="11">Fans · Watchdog · Recovery</text>
  <text x="150" y="330" text-anchor="middle" class="lbl" fill="#2DE1C6">RF-Kill-Überwachung (HW)</text>

  <!-- HyperRF -->
  <rect x="700" y="200" width="220" height="150" rx="12" class="panel"/>
  <text x="810" y="228" text-anchor="middle" class="h" font-size="16">HyperRF</text>
  <text x="810" y="250" text-anchor="middle" class="t" font-size="12">2× LMS7002M · FPGA</text>
  <text x="810" y="270" text-anchor="middle" class="m" font-size="11">4RX/4TX · 100 kHz–6 GHz</text>
  <text x="810" y="288" text-anchor="middle" class="m" font-size="11">5G · NTN · GNSS · UWB</text>
  <text x="810" y="306" text-anchor="middle" class="m" font-size="11">60-GHz-Radar (eig. Fenster)</text>
  <text x="810" y="330" text-anchor="middle" class="lbl">136×72 mm · PCIe 2.1 ×1</text>

  <!-- RF Core -->
  <rect x="300" y="410" width="360" height="120" rx="12" class="panel"/>
  <text x="480" y="438" text-anchor="middle" class="h" font-size="16">RF-Core (Low-Power)</text>
  <text x="480" y="462" text-anchor="middle" class="t" font-size="12">CC1101 · SX1262 · CC2652P7 · PN7160</text>
  <text x="480" y="482" text-anchor="middle" class="t" font-size="12">125 kHz LF-RFID · Z-Wave · UHF-RAIN · IR · 1-Wire</text>
  <text x="480" y="510" text-anchor="middle" class="lbl">92×66 mm · physischer TX/RF-Kill</text>

  <!-- Antenna rail -->
  <rect x="300" y="560" width="360" height="40" rx="10" class="panel"/>
  <text x="480" y="585" text-anchor="middle" class="t" font-size="13">Antennen-Rail · 4× externe SMA (150×18 mm)</text>

  <!-- wires -->
  <path class="wire" d="M480 144 L480 200"/>
  <path class="wire2" d="M260 275 L300 275"/>
  <path class="wire" d="M660 275 L700 275"/>
  <path class="wire" d="M480 350 L480 410"/>
  <path class="wire" d="M480 530 L480 560"/>
  <text x="270" y="268" class="lbl">I²C·UART·SPI</text>
  <text x="666" y="268" class="lbl">PCIe 2.1 ×1</text>
</svg>
