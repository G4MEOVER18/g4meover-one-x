<svg viewBox="0 0 1900 1260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,Arial,sans-serif">
  <!--
    G4MEOVER ONE-X — Systemarchitektur (vier getrennte Rechen-/Funkdomänen)
    Quelle: spec/G4MEOVER-ONE-X_MASTER_SPEC.json, Rev EVT6.
    Design-Orientierung: ChatGPT-EVT6-Vorlage (Daten-/Steuerarchitektur) — HOLD an Speicher sichtbar.
    Farbkodierung: Compute (blau) · Control (teal) · HyperRF/SDR (violett) · Low-Power-RF-Core (amber).
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DE1C6"/><stop offset="1" stop-color="#48B6F0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f8399"/>
    </marker>
    <style>
      .t{fill:#e7eef9} .m{fill:#8aa0b8} .s{fill:#6f8399}
      .box{fill:#16212e;stroke:#213140;stroke-width:1.5}
      .wire{stroke:#6f8399;stroke-width:2.5;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1260" fill="#0f1722"/>

  <!-- title block -->
  <text x="120" y="72" fill="url(#grad)" font-size="40" font-weight="800">G4MEOVER ONE-X</text>
  <text x="120" y="114" class="t" font-size="24" font-weight="600">Systemarchitektur — vier getrennte Rechen-/Funkdomänen</text>
  <text x="120" y="148" class="m" font-size="17">RK3576-Linux-Host · RP2350B-Manager · HyperRF-SDR · Low-Power-RF-Core · HOLD sichtbar</text>
  <text x="1780" y="72" class="m" font-size="16" text-anchor="end">Rev EVT6 · 2026-08-27</text>
  <text x="1780" y="96" class="m" font-size="16" text-anchor="end">Quelle: spec/G4MEOVER-ONE-X_MASTER_SPEC.json</text>

  <!-- domain legend -->
  <g font-size="15">
    <rect x="1240" y="126" width="16" height="16" rx="3" fill="#48B6F0"/><text x="1264" y="140" class="m">Compute</text>
    <rect x="1360" y="126" width="16" height="16" rx="3" fill="#2DE1C6"/><text x="1384" y="140" class="m">Control</text>
    <rect x="1470" y="126" width="16" height="16" rx="3" fill="#9b8cff"/><text x="1494" y="140" class="m">HyperRF/SDR</text>
    <rect x="1630" y="126" width="16" height="16" rx="3" fill="#f0b048"/><text x="1654" y="140" class="m">RF-Core</text>
  </g>

  <!-- ============ WIRES (drawn first, under boxes) ============ -->
  <!-- Display -> RK3576 -->
  <path class="wire" d="M810 330 L810 470" marker-end="url(#arrow)"/>
  <!-- Touch -> RK3576 -->
  <path class="wire" d="M1370 330 L1370 400 L1120 400 L1120 470" marker-end="url(#arrow)"/>
  <!-- RP2350 <-> RK3576 (bidirectional control) -->
  <path class="wire" d="M600 620 L700 620" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <!-- RK3576 -> HyperRF -->
  <path class="wire" d="M1200 620 L1300 620" marker-end="url(#arrow)"/>
  <!-- RK3576 -> LPDDR5 -->
  <path class="wire" d="M780 770 L620 830" marker-end="url(#arrow)"/>
  <!-- RK3576 -> UFS -->
  <path class="wire" d="M1120 770 L1300 830" marker-end="url(#arrow)"/>
  <!-- RK3576 -> RF-Core -->
  <path class="wire" d="M950 770 L950 980" marker-end="url(#arrow)"/>
  <!-- RF-Core -> Antenna rail -->
  <path class="wire" d="M950 1130 L950 1170" marker-end="url(#arrow)"/>

  <!-- wire labels -->
  <g font-size="15" fill="#8aa0b8">
    <rect x="742" y="388" width="140" height="24" fill="#0f1722"/><text x="812" y="406" text-anchor="middle">4-lane MIPI-DSI</text>
    <rect x="1150" y="360" width="96" height="24" fill="#0f1722"/><text x="1198" y="378" text-anchor="middle">Touch I²C/IRQ</text>
    <rect x="606" y="586" width="88" height="24" fill="#0f1722"/><text x="650" y="604" text-anchor="middle">UART·SPI</text>
    <rect x="1206" y="586" width="88" height="24" fill="#0f1722"/><text x="1250" y="604" text-anchor="middle">PCIe·USB3</text>
    <rect x="878" y="856" width="150" height="24" fill="#0f1722"/><text x="953" y="874" text-anchor="middle">USB/SPI + RF-Kill</text>
  </g>

  <!-- ============ TIER 1: Display + Touch ============ -->
  <g>
    <rect class="box" x="620" y="200" width="400" height="130" rx="14"/>
    <rect x="620" y="200" width="8" height="130" rx="4" fill="#48B6F0"/>
    <text x="820" y="248" text-anchor="middle" class="t" font-size="22" font-weight="700">5,0″ IPS Multitouch</text>
    <text x="820" y="278" text-anchor="middle" class="m" font-size="16">720×1280 nativ · 1280×720 Landscape</text>
    <text x="820" y="304" text-anchor="middle" class="s" font-size="14">4-lane MIPI-DSI direkt vom RK3576</text>
  </g>
  <g>
    <rect class="box" x="1250" y="200" width="240" height="130" rx="14"/>
    <rect x="1250" y="200" width="8" height="130" rx="4" fill="#48B6F0"/>
    <text x="1370" y="252" text-anchor="middle" class="t" font-size="20" font-weight="700">Touch</text>
    <text x="1370" y="282" text-anchor="middle" class="m" font-size="15">kapazitiv · I²C</text>
    <text x="1370" y="306" text-anchor="middle" class="s" font-size="13">RP2350 nur Wake-IRQ</text>
  </g>

  <!-- ============ TIER 2: RP2350B | RK3576 | HyperRF ============ -->
  <!-- RP2350B (Control) -->
  <g>
    <rect class="box" x="120" y="470" width="480" height="300" rx="16"/>
    <rect x="120" y="470" width="8" height="300" rx="4" fill="#2DE1C6"/>
    <text x="360" y="522" text-anchor="middle" fill="#2DE1C6" font-size="24" font-weight="800">RP2350B</text>
    <text x="360" y="552" text-anchor="middle" class="t" font-size="16">System-Manager (Always-On)</text>
    <text x="360" y="592" text-anchor="middle" class="m" font-size="15">Power · Wake · D-Pad · 5 Softkeys</text>
    <text x="360" y="618" text-anchor="middle" class="m" font-size="15">Touch-Ring · Haptik · Sensoren</text>
    <text x="360" y="644" text-anchor="middle" class="m" font-size="15">Lüfter · Watchdog · Recovery</text>
    <text x="360" y="682" text-anchor="middle" fill="#2DE1C6" font-size="15" font-weight="600">HW-RF-Kill-Überwachung</text>
    <text x="360" y="726" text-anchor="middle" class="s" font-size="14">16 MB QSPI · unabhängig von Linux</text>
  </g>

  <!-- RK3576 (Compute hub) -->
  <g>
    <rect class="box" x="700" y="470" width="500" height="300" rx="16" stroke="#48B6F0" stroke-width="2.5"/>
    <rect x="700" y="470" width="8" height="300" rx="4" fill="#48B6F0"/>
    <text x="950" y="524" text-anchor="middle" fill="url(#grad)" font-size="28" font-weight="800">RK3576 · Linux</text>
    <text x="950" y="556" text-anchor="middle" class="t" font-size="16">Applikations-Host · UI · Netzwerk · Storage</text>
    <!-- host I/O sub panel -->
    <rect x="732" y="580" width="436" height="160" rx="10" fill="#0b1017" stroke="#213140"/>
    <text x="950" y="606" text-anchor="middle" class="s" font-size="14" font-weight="600">Host-I/O (direkt am SoC)</text>
    <text x="950" y="634" text-anchor="middle" class="m" font-size="15">2× GbE · Wi-Fi 6E/BT · M.2 (PCIe/USB3)</text>
    <text x="950" y="660" text-anchor="middle" class="m" font-size="15">USB-C PD · USB3 · DP-Alt · USB-A · HDMI</text>
    <text x="950" y="694" text-anchor="middle" class="m" font-size="15">16 GB LPDDR5 · 256 GB UFS · 32 MB SPI-NOR</text>
    <text x="950" y="722" text-anchor="middle" class="s" font-size="13">Mainboard-Ziel 210×92 mm · 12-Layer-HDI (TARGET)</text>
  </g>

  <!-- HyperRF (SDR) -->
  <g>
    <rect class="box" x="1300" y="470" width="480" height="300" rx="16"/>
    <rect x="1300" y="470" width="8" height="300" rx="4" fill="#9b8cff"/>
    <text x="1540" y="522" text-anchor="middle" fill="#9b8cff" font-size="24" font-weight="800">HyperRF</text>
    <text x="1540" y="552" text-anchor="middle" class="t" font-size="16">2× LMS7002M · FPGA (MPN HOLD)</text>
    <text x="1540" y="592" text-anchor="middle" class="m" font-size="15">4RX/4TX · 100 kHz – 6 GHz</text>
    <text x="1540" y="618" text-anchor="middle" class="m" font-size="15">5G · NTN · GNSS · UWB</text>
    <text x="1540" y="644" text-anchor="middle" class="m" font-size="15">60-GHz-Radar (eigenes Fenster)</text>
    <text x="1540" y="682" text-anchor="middle" class="s" font-size="14">M.2-Modul 136×72 mm · PCIe 2.1×1 + USB3</text>
    <text x="1540" y="726" text-anchor="middle" fill="#f0b048" font-size="14" font-weight="600">FPGA-Auswahl offen → Gate G04 (HOLD)</text>
  </g>

  <!-- ============ TIER 2b: memory HOLD badges ============ -->
  <!-- LPDDR5 HOLD -->
  <g>
    <rect x="470" y="830" width="300" height="110" rx="12" fill="#1c1710" stroke="#f0b048" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="686" y="842" width="72" height="26" rx="6" fill="#f0b048"/><text x="722" y="861" text-anchor="middle" fill="#1c1710" font-size="15" font-weight="800">HOLD</text>
    <text x="562" y="874" text-anchor="middle" class="t" font-size="18" font-weight="700">16 GB LPDDR5</text>
    <text x="562" y="902" text-anchor="middle" class="m" font-size="14">Topologie unbestätigt</text>
    <text x="562" y="924" text-anchor="middle" class="s" font-size="13">Rockchip-16GB-Support → Gate G02</text>
  </g>
  <!-- UFS HOLD -->
  <g>
    <rect x="1130" y="830" width="300" height="110" rx="12" fill="#1c1710" stroke="#f0b048" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="1346" y="842" width="72" height="26" rx="6" fill="#f0b048"/><text x="1382" y="861" text-anchor="middle" fill="#1c1710" font-size="15" font-weight="800">HOLD</text>
    <text x="1222" y="874" text-anchor="middle" class="t" font-size="18" font-weight="700">256 GB UFS</text>
    <text x="1222" y="902" text-anchor="middle" class="m" font-size="14">Generation/MPN unbestätigt</text>
    <text x="1222" y="924" text-anchor="middle" class="s" font-size="13">RK3576-UFS-Host-Validierung → Gate G03</text>
  </g>

  <!-- ============ TIER 3: RF-Core ============ -->
  <g>
    <rect class="box" x="560" y="980" width="780" height="150" rx="16"/>
    <rect x="560" y="980" width="8" height="150" rx="4" fill="#f0b048"/>
    <text x="950" y="1024" text-anchor="middle" fill="#f0b048" font-size="22" font-weight="800">Low-Power-RF-Core</text>
    <text x="950" y="1056" text-anchor="middle" class="t" font-size="16">CC1101 · SX1262 · CC2652P7 · PN7160</text>
    <text x="950" y="1082" text-anchor="middle" class="t" font-size="16">125 kHz LF-RFID · Z-Wave · UHF-RAIN · IR · 1-Wire</text>
    <text x="950" y="1110" text-anchor="middle" class="s" font-size="14">Modul-Ziel 92×66 mm · physischer TX/RF-Kill (Supervisor zuerst)</text>
  </g>

  <!-- ============ Antenna rail ============ -->
  <g>
    <rect class="box" x="640" y="1170" width="620" height="56" rx="12"/>
    <text x="950" y="1205" text-anchor="middle" class="t" font-size="16">Antennen-Rail · 4× externe SMA (FIXED)</text>
  </g>
</svg>
