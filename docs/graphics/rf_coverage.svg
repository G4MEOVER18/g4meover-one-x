<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DE1C6"/><stop offset="1" stop-color="#48B6F0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="#0f1722"/>
  <text x="32" y="40" fill="url(#g)" font-size="24" font-weight="800">RF-Abdeckung — G4MEOVER ONE-X</text>
  <text x="32" y="63" fill="#8aa0b8" font-size="13">Logarithmische Frequenzachse · 125 kHz bis 64 GHz · ein Gerät</text>

  <!-- axis -->
  <line x1="60" y1="360" x2="920" y2="360" stroke="#213140" stroke-width="2"/>
  <!-- decade ticks: 100kHz,1MHz,10MHz,100MHz,1GHz,10GHz,100GHz -->
  <g fill="#8aa0b8" font-size="11" text-anchor="middle">
    <text x="60" y="380">100 kHz</text>
    <text x="203" y="380">1 MHz</text>
    <text x="346" y="380">10 MHz</text>
    <text x="489" y="380">100 MHz</text>
    <text x="632" y="380">1 GHz</text>
    <text x="775" y="380">10 GHz</text>
    <text x="918" y="380">100 GHz</text>
  </g>

  <!-- bars: x from log scale. helper positions computed for decades (143px/decade from x=60) -->
  <!-- HyperRF SDR 100kHz-6GHz -> 60 .. 60+143*log10(6e9/1e5)=60+143*4.778=743 -->
  <rect x="60" y="96" width="683" height="24" rx="6" fill="url(#g)" opacity="0.95"/>
  <text x="66" y="113" fill="#0f1722" font-size="12" font-weight="700">HyperRF SDR · 100 kHz – 6 GHz (2× LMS7002M, 4RX/4TX)</text>

  <!-- Sub-GHz CC1101/SX1262 ~300-960MHz -> log10(3e8/1e5)=3.477->557 ; log10(9.6e8/1e5)=3.982->629 -->
  <rect x="557" y="132" width="72" height="20" rx="5" fill="#48B6F0"/>
  <text x="500" y="147" fill="#e7eef9" font-size="11" text-anchor="end">Sub-GHz (CC1101/SX1262) ▸</text>

  <!-- LF RFID 125kHz -> log10(1.25e5/1e5)=0.097->74 -->
  <rect x="62" y="168" width="22" height="20" rx="5" fill="#2DE1C6"/>
  <text x="92" y="183" fill="#e7eef9" font-size="11">125 kHz LF-RFID</text>

  <!-- NFC 13.56MHz -> log10(1.356e7/1e5)=2.132->365 -->
  <rect x="356" y="168" width="18" height="20" rx="5" fill="#2DE1C6"/>
  <text x="382" y="183" fill="#e7eef9" font-size="11">NFC/HF 13,56 MHz (PN7160)</text>

  <!-- UHF RAIN 860-960MHz -> ~618-629 -->
  <rect x="600" y="168" width="30" height="20" rx="5" fill="#2DE1C6"/>
  <text x="640" y="183" fill="#e7eef9" font-size="11">UHF RAIN 860–960 MHz (E710)</text>

  <!-- 2.4GHz Zigbee/BLE/WiFi -> log10(2.4e9/1e5)=4.38->686 -->
  <rect x="676" y="204" width="26" height="20" rx="5" fill="#48B6F0"/>
  <text x="712" y="219" fill="#e7eef9" font-size="11">2,4 GHz Zigbee/Thread/BLE (CC2652P7)</text>

  <!-- GNSS L1/L5 ~1.2-1.6GHz -> log10(1.2e9)=650, 1.6e9=666 -->
  <rect x="648" y="240" width="20" height="20" rx="5" fill="#48B6F0"/>
  <text x="676" y="255" fill="#e7eef9" font-size="11">GNSS L1/L5 (u-blox NEO-F10N)</text>

  <!-- 5G Sub-6 + mmWave 24-40GHz -> sub6 ~3.5GHz=804? recompute: log10(3.5e9/1e5)=4.544->710 ; mmwave 28e9 -> log10(2.8e11? no 2.8e10/1e5)=5.447->839 -->
  <rect x="700" y="276" width="30" height="20" rx="5" fill="#48B6F0"/>
  <rect x="815" y="276" width="45" height="20" rx="5" fill="#48B6F0"/>
  <text x="736" y="291" fill="#e7eef9" font-size="11">5G Sub-6 ▪ mmWave (Quectel RM530N)</text>

  <!-- UWB 6-9GHz -> log10(6e9/1e5)=4.778->743 .. 9e9=4.954->768 -->
  <rect x="743" y="312" width="25" height="20" rx="5" fill="#2DE1C6"/>
  <text x="778" y="327" fill="#e7eef9" font-size="11">UWB 6–9 GHz (DW3000)</text>

  <!-- Radar 57-64GHz -> log10(5.7e10/1e5)=5.756->883 -->
  <rect x="883" y="312" width="30" height="20" rx="5" fill="#ff8a5c"/>
  <text x="878" y="305" fill="#ff8a5c" font-size="11" text-anchor="end">60-GHz-Radar (separat, IWRL6432W) ▸</text>
</svg>
