<svg viewBox="0 0 1900 1120" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,system-ui,Arial,sans-serif">
  <!--
    G4MEOVER ONE-X — RF-Abdeckung (statusehrliches Spektrum)
    Quelle: spec/G4MEOVER-ONE-X_MASTER_SPEC.json (rf_core + hyperrf), Rev EVT6.
    Log-Frequenzachse: x(f) = 140 + 273.33*log10(f/1e5), 100 kHz … 100 GHz.
    Bandfarbe = Reifegrad-STATUS (nicht Optik):
      FIXED=grün · VALIDATED_ARCH=blau · TARGET=amber · HOLD=rot(gestrichelt).
    Forbidden-Claim-Guard: kein 60-GHz-SDR · UWB-Suffix offen (HOLD) · GNSS nur L1/L5.
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DE1C6"/><stop offset="1" stop-color="#48B6F0"/>
    </linearGradient>
    <style>
      .t{fill:#e7eef9} .m{fill:#8aa0b8} .s{fill:#6f8399}
      .grid{stroke:#1b2836;stroke-width:1}
      .lbl{font-size:15px;fill:#e7eef9}
      .sec{font-size:16px;font-weight:700}
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1120" fill="#0f1722"/>

  <!-- title block -->
  <text x="140" y="66" fill="url(#grad)" font-size="38" font-weight="800">G4MEOVER ONE-X</text>
  <text x="140" y="106" class="t" font-size="23" font-weight="600">RF-Abdeckung — ein Gerät, 100 kHz bis 100 GHz</text>
  <text x="140" y="138" class="m" font-size="16">Logarithmische Frequenzachse · Bandfarbe = Reifegrad-Status · Rev EVT6</text>
  <text x="1780" y="66" class="m" font-size="15" text-anchor="end">Quelle: spec … (rf_core + hyperrf)</text>

  <!-- status legend -->
  <g font-size="15">
    <rect x="1180" y="92" width="15" height="15" rx="3" fill="#3ecf8e"/><text x="1202" y="105" class="m">FIXED</text>
    <rect x="1280" y="92" width="15" height="15" rx="3" fill="#48B6F0"/><text x="1302" y="105" class="m">VALIDATED_ARCH</text>
    <rect x="1470" y="92" width="15" height="15" rx="3" fill="#f0b048"/><text x="1492" y="105" class="m">TARGET</text>
    <rect x="1580" y="92" width="15" height="15" rx="3" fill="#f0714b" stroke="#f0714b" stroke-dasharray="3 2"/><text x="1602" y="105" class="m">HOLD</text>
  </g>

  <!-- ===================== axis grid (decades) ===================== -->
  <g class="grid">
    <line x1="140" y1="175" x2="140" y2="810"/>
    <line x1="413" y1="175" x2="413" y2="810"/>
    <line x1="687" y1="175" x2="687" y2="810"/>
    <line x1="960" y1="175" x2="960" y2="810"/>
    <line x1="1233" y1="175" x2="1233" y2="810"/>
    <line x1="1507" y1="175" x2="1507" y2="810"/>
    <line x1="1780" y1="175" x2="1780" y2="810"/>
  </g>
  <line x1="140" y1="810" x2="1780" y2="810" stroke="#42546a" stroke-width="2"/>
  <g class="m" font-size="15" text-anchor="middle">
    <text x="140" y="836">100 kHz</text>
    <text x="413" y="836">1 MHz</text>
    <text x="687" y="836">10 MHz</text>
    <text x="960" y="836">100 MHz</text>
    <text x="1233" y="836">1 GHz</text>
    <text x="1507" y="836">10 GHz</text>
    <text x="1780" y="836">100 GHz</text>
  </g>

  <!-- ===================== SECTION: HyperRF ===================== -->
  <text x="30" y="205" class="sec" fill="#9b8cff">HyperRF</text>

  <!-- L1 SDR: native 100kHz-3.8GHz (VALIDATED_ARCH) + ext to 6GHz (TARGET) -->
  <text x="145" y="214" class="lbl">HyperRF-SDR · 2× LMS7002M 4RX/4TX · 100 kHz–3,8 GHz nativ, →6 GHz erweitert</text>
  <rect x="140" y="220" width="1252" height="24" rx="5" fill="#48B6F0" opacity="0.9"/>
  <rect x="1392" y="220" width="54" height="24" rx="5" fill="#f0b048" opacity="0.9" stroke="#f0b048" stroke-dasharray="6 4"/>

  <!-- L2 GNSS L1/L5 1.2 & 1.6GHz (TARGET) -->
  <text x="1300" y="278" class="lbl" font-size="14">GNSS L1/L5 · u-blox NEO-F10N-Klasse</text>
  <rect x="1249" y="266" width="12" height="24" rx="4" fill="#f0b048" opacity="0.9"/>
  <rect x="1283" y="266" width="12" height="24" rx="4" fill="#f0b048" opacity="0.9"/>

  <!-- L3 5G Sub-6 (3.3-3.8GHz) + mmWave (24-40GHz) (TARGET) -->
  <text x="1375" y="304" class="lbl" font-size="14">5G Sub-6 + mmWave · Quectel RM530N-Klasse</text>
  <rect x="1375" y="312" width="17" height="24" rx="4" fill="#f0b048" opacity="0.9"/>
  <rect x="1611" y="312" width="60" height="24" rx="4" fill="#f0b048" opacity="0.9"/>

  <!-- L4 NTN L/S-Band (~1.6-2.2GHz) (TARGET) -->
  <text x="1340" y="370" class="lbl" font-size="14">NTN (IoT-NTN) · Quectel BG95-S5-Klasse</text>
  <rect x="1289" y="358" width="38" height="24" rx="4" fill="#f0b048" opacity="0.9"/>

  <!-- L5 LoRa-Sat LR1121 sub-GHz/2.4/L/S (TARGET) -->
  <text x="1350" y="416" class="lbl" font-size="14">LoRa-Sat · Semtech LR1121-Klasse (sub-GHz · 2,4 · L/S)</text>
  <rect x="1215" y="404" width="127" height="24" rx="4" fill="#f0b048" opacity="0.55"/>

  <!-- L6 UWB 6-9GHz (HOLD - suffix offen) -->
  <text x="1508" y="462" class="lbl" font-size="14">UWB 6–9 GHz · Qorvo DW3000-Serie — Suffix offen</text>
  <rect x="1446" y="450" width="49" height="24" rx="4" fill="#f0714b" opacity="0.9" stroke="#f0714b" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- ===================== SECTION: Low-Power-RF-Core ===================== -->
  <text x="30" y="512" class="sec" fill="#f0b048">RF-Core</text>

  <!-- L7 Sub-GHz CC1101 / SX1262 ~300-960MHz (FIXED) -->
  <text x="700" y="530" class="lbl">Sub-GHz · CC1101 (Protokoll/Raw) + SX1262 (LoRa/FSK) · ~300–960 MHz</text>
  <rect x="1090" y="536" width="138" height="24" rx="5" fill="#3ecf8e" opacity="0.9"/>

  <!-- L8 Z-Wave (TARGET) + UHF RAIN 860-960MHz (TARGET) -->
  <text x="700" y="576" class="lbl">Z-Wave/LR (EFR32ZG23-Kl.) + UHF-RAIN 860–960 MHz (Impinj E710-Kl.)</text>
  <rect x="1213" y="582" width="16" height="24" rx="4" fill="#f0b048" opacity="0.9"/>

  <!-- L9 2.4GHz Zigbee/Thread/BLE CC2652P7 (FIXED) -->
  <text x="700" y="622" class="lbl">2,4 GHz · Zigbee / Thread / BLE · CC2652P7</text>
  <rect x="1329" y="628" width="16" height="24" rx="4" fill="#3ecf8e" opacity="0.9"/>

  <!-- L10 NFC 13.56MHz (FIXED) + 125kHz LF-RFID (FIXED) + IR/1-Wire note -->
  <text x="180" y="668" class="lbl">125 kHz LF-RFID</text>
  <rect x="160" y="674" width="12" height="24" rx="4" fill="#3ecf8e" opacity="0.9"/>
  <text x="740" y="668" class="lbl">13,56 MHz NFC/HF · PN7160</text>
  <rect x="716" y="674" width="14" height="24" rx="4" fill="#3ecf8e" opacity="0.9"/>
  <text x="960" y="700" class="s" font-size="13">IR-TX/RX + geschütztes 1-Wire/AUX (optisch/leitungsgebunden, FIXED — nicht auf Frequenzachse)</text>

  <!-- ===================== SECTION: Spezial-Fenster ===================== -->
  <text x="30" y="748" class="sec" fill="#f0714b">Spezial</text>

  <!-- L11 60GHz radar 57-64GHz (TARGET, separate window) -->
  <text x="1697" y="768" class="lbl" font-size="14" text-anchor="end">60-GHz-Radar 57–64 GHz · TI IWRL6432W-Klasse · separates HF-Fenster</text>
  <rect x="1713" y="762" width="16" height="24" rx="4" fill="#f0b048" opacity="0.9"/>

  <!-- ===================== Forbidden-claim guard ===================== -->
  <rect x="140" y="880" width="1640" height="180" rx="12" fill="#141b13" stroke="#2a3a24"/>
  <text x="168" y="916" class="t" font-size="17" font-weight="700">Bewusst NICHT behauptet (Forbidden Claims aus Master-Spec)</text>
  <g class="m" font-size="15">
    <text x="168" y="950">✗ Kein „DC–60 GHz-SDR" und kein general-purpose 60-GHz-SDR — der SDR endet bei 6 GHz (erweitert); 60 GHz ist ein separates Radar-Fenster.</text>
    <text x="168" y="980">✗ Kein UWB „SR150" — UWB ist Qorvo DW3000-Serie mit noch offenem Suffix (HOLD, Gate G05).</text>
    <text x="168" y="1010">✗ Kein „GNSS L1/L2/L5" — aktuelles Ziel ist NEO-F10N-Klasse mit L1/L5.</text>
    <text x="168" y="1040">HyperRF-FPGA (PCIe-Endpoint/DSP/Channelization) ist HOLD (Gate G04); PCIe 2.1×1 begrenzt kontinuierliches Streaming → FPGA-Dezimierung nötig.</text>
  </g>
</svg>
